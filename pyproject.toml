[project]
name = "strava"
version = "0.1.0"
description = "Python library for the Strava API v3"
readme = "README.md"
authors = [
    { name = "Reinier Hernández", email = "sasuke.reinier@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
