[project]
name = "strava"
version = "0.5.0"
description = "Python library for the Strava API v3"
readme = "README.md"
authors = [
    { name = "Reinier Hernández", email = "sasuke.reinier@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
