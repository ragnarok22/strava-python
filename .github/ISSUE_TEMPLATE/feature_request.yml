name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the feature you'd like to see.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature.
      placeholder: I'd like to be able to...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this feature? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API
      description: How would you like the feature to work? Show example code if possible.
      render: python
      placeholder: |
        # Example of how the feature could be used
        result = client.activities.list_photos(activity_id=123)
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New endpoint
        - New model
        - Authentication
        - Pagination
        - Error handling
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, links to Strava API docs, or references.
    validations:
      required: false
